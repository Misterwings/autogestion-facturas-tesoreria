name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: payment_receipts_test
          POSTGRES_USER: payment_receipts
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_receipts -d payment_receipts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, intl, mbstring, pdo_pgsql, pdo_sqlite, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run PHPUnit
        run: php artisan test

      - name: Run PHPUnit with PostgreSQL 17
        run: php artisan test
        env:
          TEST_DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: payment_receipts_test
          DB_USERNAME: payment_receipts
          DB_PASSWORD: secret

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
